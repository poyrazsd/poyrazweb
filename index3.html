<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Hakkımda</title>
<style>
    body {
        font-family: "Helvetica Neue", Arial, sans-serif;
        background-color: #eef1f4;
        padding: 20px;
    }
    .container {
        max-width: 620px;
        margin: 0 auto;
    }
    h2 {
        color: #2f5fa8;
        border-bottom: 2px solid #2f5fa8;
        padding-bottom: 6px;
        margin-bottom: 15px;
        font-size: 20px;
        font-weight: bold;
    }
    .kutu {
        background-color: #ffffff;
        border: 1px solid #d6dae0;
        border-radius: 6px;
        padding: 18px 20px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        line-height: 1.6;
        font-size: 14px;
        color: #2c2c2c;
    }
    .kutu p {
        margin: 0 0 12px 0;
    }
    .kutu p:last-child {
        margin-bottom: 0;
    }
</style>
</head>
<body>

<div class="container">
    <h2>Hakkımda</h2>
    <div class="kutu">
        <p>Merhaba! Ben Poyraz. Mesleki Elektrik-Elektronik bölümünde okuyorum ve <b>web tasarımı</b> öğreniyorum. Bu sayfayı HTML ve CSS dersinde öğrendiklerimi kullanarak hazırladım.</p>
        <p>Boş zamanlarımda Oyun oynamayı, Video İzlemeyi ve <em>yeni şeyler öğrenmeyi</em> seviyorum.</p>
    </div>
</div>

</body>
</html>
