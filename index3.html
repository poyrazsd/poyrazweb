<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hakkımda - Poyraz</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fdfdfd;
            color: #333;
            margin: 50px;
        }

        .icerik-alani {
            max-width: 700px;
            text-align: left;
        }

        /* Mavi Hakkımda Başlığı */
        h2 {
            color: #007BFF;
            font-size: 30px;
            margin-bottom: 5px;
        }

        /* Başlığın altındaki mavi çizgi */
        .cizgi {
            height: 2px;
            background-color: #007BFF;
            width: 100%;
            margin-bottom: 25px;
        }

        /* Büyütülmüş cümle fontu */
        p {
            font-size: 18px; /* Fontu biraz büyüttük */
            line-height: 1.7;
            margin-bottom: 15px;
        }

        /* Arka plan vurgusu (sarı/kırmızı) kaldırıldı, sadece kalın yazı kaldı */
        mark {
            background-color: transparent;
            color: inherit;
            font-weight: bold;
            padding: 0;
        }
    </style>
</head>
<body>

    <div class="icerik-alani">
        <h2>Hakkımda</h2>
        <div class="cizgi"></div>
        
        <p>Merhaba Ben Poyraz. Mesleki Elektrik-Elektronik bölümünde okuyorum ve <mark>web tasarımı</mark> öğreniyorum. Bu sayfayı HTML ve CSS dersinde öğrendiklerimi kullanarak hazırladım.</p>
        <p>Boş zamanlarımda Oyun oynamayı, Video İzlemeyi ve yeni şeyler öğrenmeyi seviyorum.</p>
    </div>

</body>
</html>
